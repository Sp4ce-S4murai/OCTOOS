name: Build Signed Release APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/octoos-release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/octoos-release.jks" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/octoos-release.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias octoos \
              -storepass octoos123 \
              -keypass octoos123 \
              -dname "CN=OctoOS, OU=Launcher, O=OctoOS, L=BR, S=SP, C=BR"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/octoos-release.jks" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=octoos123" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=octoos" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=octoos123" >> $GITHUB_ENV
          fi

      - name: Compute Version Tag and VersionCode
        id: version
        run: |
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '\r')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '\r')
          COMMITS=$(git rev-list --count HEAD)
          TAG="v${MAJOR}.${MINOR}.${COMMITS}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_code=$COMMITS" >> $GITHUB_OUTPUT
          echo "apk_name=OctoOS-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and rename Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "${{ steps.version.outputs.apk_name }}"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OctoOS ${{ steps.version.outputs.tag }} (build #${{ steps.version.outputs.version_code }})"
          generate_release_notes: true
          files: ${{ steps.version.outputs.apk_name }}

